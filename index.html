<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARS CALL - Deck Mondes</title>
    <style>
        :root {
            --gold: #c9a050;
            --blue: #4da6ff;
            --dark-bg: #0b0f19;
            --card-bg: #161d2b;
            --text: #e0e0e0;
            --danger: #ff4757;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* --- ÉCRAN DE CONFIGURATION --- */
        #setup-screen {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #34495e;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        select {
            background: var(--dark-bg);
            color: white;
            padding: 10px 20px;
            font-size: 1.2rem;
            border: 1px solid var(--blue);
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
        }

        /* --- GRILLE DES CARTES --- */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 1400px;
        }

        .worlds-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #34495e;
            border-radius: 12px;
            width: 300px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .card-img-container {
            width: 100%;
            aspect-ratio: 1488 / 2079;
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex; 
            align-items: center;
            justify-content: center;
        }


        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }

        .world-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--blue);
        }

        .world-type {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .stat-item span { color: var(--gold); }

        .description {
            font-size: 0.9rem;
            color: #ccc;
            font-style: italic;
            line-height: 1.4;
        }

        /* --- SELECTEUR --- */
        .card-footer {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-top: 1px solid #34495e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-selector {
            transform: scale(1.5);
            cursor: pointer;
            accent-color: var(--gold);
        }

        .card-footer label {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text);
            font-weight: bold;
        }

        /* --- BOUTONS --- */
        .btn {
            background: linear-gradient(135deg, var(--blue) 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(77, 166, 255, 0.4);
            margin-top: 20px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(77, 166, 255, 0.7);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #turn-counter {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-align: center;
        }

        .no-image {
            position: absolute; /* Pour ne pas gêner si l'image charge */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #555;
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
            z-index: 0;
        }
        
        /* On met l'image au dessus du texte "no image" */
        .card-img {
            z-index: 1;
            position: relative;
        }

        .type-faciles { border-top: 4px solid #2ecc71; }
        .type-gazeux { border-top: 4px solid #f1c40f; }
        .type-hostiles { border-top: 4px solid #e74c3c; }
        .type-abysses { border-top: 4px solid #9b59b6; }

    </style>
</head>
<body>

    <h1>Stars Call - Secteur en cours</h1>

    <div id="setup-screen">
        <h2>Initialisation de la Galaxie</h2>
        <p>Combien de Civilisations sont en jeu ?</p>
        <select id="civ-count">
            <option value="2">2 Civilisations</option>
            <option value="3">3 Civilisations</option>
            <option value="4">4 Civilisations</option>
            <option value="5">5 Civilisations</option>
            <option value="6">6 Civilisations</option>
        </select>
        <br><br>
        <button class="btn" onclick="startGame()">Lancer la partie</button>
    </div>

    <div id="game-screen">
        <div id="turn-counter">Tour 1</div>
        <div class="worlds-grid" id="worlds-container">
            </div>
        
        <div style="text-align: center;">
            <button class="btn" id="btn-next" onclick="nextTurn()">Tour Suivant</button>
            <p id="deck-status" style="margin-top:10px; color:#666; font-size: 0.9rem;"></p>
        </div>
    </div>

    <script>
        const worldsDB = [
            // Faciles
            { name: "Exo-Alpha", m: 5, t: 10, type: "Faciles", desc: "Gros Satellite de la planète gazeuse Alpha-Pax. Luxuriant." },
            { name: "Prima", m: 5, t: 10, type: "Faciles", desc: "Planète extrêmement verdoyante, idéale pour l'agriculture." },
            { name: "Nova", m: 5, t: 10, type: "Faciles", desc: "La végétation produit une substance anti-vieillissement." },
            { name: "Sélénia", m: 5, t: 10, type: "Faciles", desc: "Nuit éternelle mais tempérée. Eau saturée de sel." },
            
            // Gazeux
            { name: "Jupiter-9", m: 30, t: 20, type: "Gazeux", desc: "Monde océan, tempêtes violentes. Énergie marémotrice." },
            { name: "Titan-X", m: 30, t: 20, type: "Gazeux", desc: "Orages permanents et cristaux de carbonates." },
            { name: "Goliath", m: 30, t: 20, type: "Gazeux", desc: "Océans chauds souterrains sous la croute." },
            { name: "Atlas", m: 30, t: 20, type: "Gazeux", desc: "Cristaux géants de bauxite pour l'aluminium." },

            // Solaires
            { name: "Ignis", m: 10, t: 130, type: "Solaires", desc: "Monde volcanique, source de Terres Rares." },
            { name: "Helios", m: 10, t: 130, type: "Solaires", desc: "Monde à l'atmosphère ionisé par le xénon." },
            { name: "Vulcain", m: 10, t: 130, type: "Solaires", desc: "Monde avec des métaux précieux, surtout le tungstène." },
            { name: "Magma", m: 10, t: 130, type: "Solaires", desc: "Géothermie transformée en énergie électrique." },
            
            // Équilibrés
            { name: "Aeria", m: 15, t: 60, type: "Équilibrés", desc: "Vent puissant et pieres précieuses." },
            { name: "Calypso", m: 15, t: 60, type: "Équilibrés", desc: "Paradis touristiques, faunes et flores extraordinaires." },
            { name: "Zephyr", m: 15, t: 60, type: "Équilibrés", desc: "Monde aux graines virevoltantes et mystérieuses." },
            { name: "Mist", m: 15, t: 60, type: "Équilibrés", desc: " Monde-forêt qui recouvre toute la planète." },            

            // Hostiles
            { name: "Osiris", m: 40, t: 100, type: "Hostiles", desc: "Développer un mode de survie dans un environnement chaud." },
            { name: "Thanatos", m: 40, t: 100, type: "Hostiles", desc: "Monde de vapeurs d'acide sulfurique." },
            { name: "Krios", m: 40, t: 100, type: "Hostiles", desc: "Geysers de lave contenant du cuivre en fusion." },
            { name: "Juggernaut", m: 40, t: 100, type: "Hostiles", desc: "Monde de glace regorgeant d'hélium-3 pour la fusion." },
            
            // Abysses (Mondes Défis)
            { name: "Erebus", m: 50, t: 160, type: "Abysses", desc: "DÉFI: Le vainqueur ajoute une carte au tour suivant." },
            { name: "Abyss", m: 50, t: 160, type: "Abysses", desc: "DÉFI: Bonus de point si possession d'un monde léger." },
            { name: "Horizon", m: 50, t: 160, type: "Abysses", desc: "DÉFI: Le vainqueur fait défausser 2 cartes à un rival." },
            { name: "Omega", m: 50, t: 160, type: "Abysses", desc: "DÉFI: Ajouter 1 d'énergie au 2 prochains tours." },
        ];

        let deck = [];
        let displayedWorlds = [];
        let worldsPerTurn = 2;
        let turn = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            const civCount = parseInt(document.getElementById('civ-count').value);
            worldsPerTurn = Math.min(civCount, 4);
            deck = [...worldsDB];
            shuffle(deck);

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            drawWorlds();
        }

        function nextTurn() {
            const checkboxes = document.querySelectorAll('.card-selector');
            let keptWorlds = [];

            checkboxes.forEach((cb, index) => {
                if (!cb.checked) {
                    if (displayedWorlds[index]) {
                        keptWorlds.push(displayedWorlds[index]);
                    }
                }
            });

            displayedWorlds = keptWorlds;
            drawWorlds();
        }

        function drawWorlds() {
            const container = document.getElementById('worlds-container');
            const btn = document.getElementById('btn-next');
            const status = document.getElementById('deck-status');
            
            container.innerHTML = "";
            
            turn++;
            document.getElementById('turn-counter').innerText = "Tour " + turn;

            const needed = worldsPerTurn - displayedWorlds.length;
            const countToDraw = Math.min(needed, deck.length);
            
            for (let i = 0; i < countToDraw; i++) {
                const world = deck.pop();
                displayedWorlds.push(world);
            }

            displayedWorlds.forEach(world => {
                createCardHTML(world, container);
            });

            status.innerText = `Mondes restants dans la pioche : ${deck.length}`;
            
            if(deck.length === 0 && displayedWorlds.length === 0) {
                 container.innerHTML = "<h2 style='color:var(--danger)'>FIN DE LA CONQUÊTE</h2>";
                 btn.style.display = "none";
            } else if (deck.length === 0) {
                 btn.innerText = "Terminer (Deck vide)";
            }
        }

        function createCardHTML(world, container) {
            const imageName = world.name + ".jpg"; 
            /*const imagePath = "images_mondes-google_sites/" + imageName;*/
            const imagePath = "images_mondes-google_sites/" + imageName;
            const typeClass = "type-" + world.type.toLowerCase();

            const html = `
                <div class="card ${typeClass}">
                    <div class="card-img-container">
                        <img src="${imagePath}" alt="${world.name}" class="card-img" onerror="this.style.display='none';">
                        <div class="no-image">Image non trouvée<br>${imagePath}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-header">
                            <span class="world-name">${world.name}</span>
                            <span class="world-type">${world.type}</span>
                        </div>
                        <div class="stats-row">
                            <div class="stat-item">Masse: <span>${world.m}</span></div>
                            <div class="stat-item">Temp: <span>${world.t}</span></div>
                        </div>
                        <div class="description">${world.desc}</div>
                    </div>
                    <div class="card-footer">
                        <input type="checkbox" class="card-selector" id="select-${world.name}" checked>
                        <label for="select-${world.name}">Monde Sélectionné</label>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }
    </script>
</body>
</html>
